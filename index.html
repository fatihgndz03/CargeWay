<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CargeWay — Çok Yakında</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .logo{width:72px;height:72px;background:#22c55e;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .logo svg{width:36px;height:36px}
    .brand{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
    .brand span{color:#22c55e}
    .sub{font-size:12px;color:#666;letter-spacing:4px;margin-bottom:32px}
    .badge{display:inline-block;background:#14532d;color:#22c55e;font-size:11px;padding:4px 14px;border-radius:20px;margin-bottom:24px}
    h1{font-size:52px;font-weight:800;line-height:1.1;margin-bottom:16px}
    h1 span{color:#22c55e}
    p{color:#888;font-size:16px;margin-bottom:8px}
    p strong{color:#fff}
    .form{margin-top:32px;display:flex;gap:8px;max-width:360px;margin-left:auto;margin-right:auto}
    input{flex:1;padding:12px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;outline:none}
    input:focus{border-color:#22c55e}
    button{padding:12px 20px;background:#22c55e;color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer}
    .footer{margin-top:40px;font-size:12px;color:#444}
  </style>
</head>
<body>
  <div>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <div class="brand">CARGE<span>WAY</span></div>
    <div class="sub">ELECTRIC VEHICLE CHARGING</div>
    <div class="badge">● GELİYOR</div>
    <h1>Çok <span>Yakında</span></h1>
    <p>Türkiye'nin <strong>EV şarj platformu</strong> hazırlanıyor.</p>
    <p>Akıllı, hızlı ve her yerde şarj.</p>
    <div class="form">
      <input type="email" placeholder="ornek@email.com" />
      <button>→</button>
    </div>
    <div class="footer">© 2026 CargeWay. Tüm hakları saklıdır.</div>
  </div>
</body>
</html>
